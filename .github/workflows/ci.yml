name: Academic OS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-p0.txt
            requirements-p6a.txt
            requirements-p6ui.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements-p0.txt
          pip install -r requirements-p6a.txt
          pip install -r requirements-p6ui.txt

      # P6UI console acceptance remains local-only for now.
      # It depends on the governed var/p0_q2.sqlite3 trusted baseline
      # and frozen binary presentation artifacts that are not stored in Git.
      - name: Run syllabus ingestion tests
        run: python -m unittest tests_p0.test_syllabus_ingestion -v


  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend data tests
        run: npm run test:data

      - name: Run lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build